# Reruns the long-history analyses (single offers since FY2008, pile-ups under every dollar limit, the 2018 agency-by-agency
# test, drivers, split-like clusters, post-award outcomes) from the public yearly tables in the release "history-v1",
# then rebuilds the README numbers, the dashboard and the explorer, and commits the results.
# It first checks that every yearly table was verified when it was downloaded (run.py get-history --require-verified) and
# compares the settled years with USAspending's own totals (scripts/28_reconcile.py --strict); it stops if either check fails.
# Runs every Sunday and on demand (Actions tab, "Run workflow"). Takes about half an hour.
name: History analyses

on:
  schedule:
    - cron: "0 6 * * 0"      # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIO_CONTACT: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Two checks before anything is analysed or committed (see docs/download-integrity.md):
      # 1. every yearly table must say it was verified against USAspending's own counts when it was downloaded
      #    (get-history --require-verified fails, listing the years, for a table marked not verified or with no record);
      # 2. 28_reconcile.py --strict compares each settled year (ended more than 15 months ago) with USAspending's totals today:
      #    more than 0.5 percent apart fails. A recent year fails only if our count is above USAspending's. If USAspending
      #    cannot be reached, the check fails and nothing is committed that week.
      - name: Check the yearly tables (verification records, then USAspending's totals)
        run: |
          python run.py get-history --require-verified
          python -I scripts/28_reconcile.py --strict

      - name: Download the yearly tables and rerun the history analyses
        run: python run.py history

      - name: Rebuild the README numbers, the dashboard and the explorer
        run: |
          python run.py report
          python run.py dashboard
          python run.py explorer

      - name: Check the sealed forecast is unchanged
        run: |
          cd forecasts
          grep PIO-F2 SHA256SUMS.txt | awk '{print $1"  "$2}' | sha256sum -c -

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results figures docs README.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "History analyses: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((i * 20))
          done
          exit 1
