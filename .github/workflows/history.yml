# Builds the long history (FY2008 onward; civilian agencies and the Department of Defense) on GitHub's computers, one job per fiscal year,
# and publishes the compact yearly tables (scripts/18_history_build.py) as assets of the public release "history-v1".
# Start it from the Actions tab ("Run workflow"). Each year takes up to an hour, mostly waiting on USAspending; rerunning a year replaces its files.
# Every year is always built from both sectors (civilian and Defense). For a one-sector download on your own computer, use
# python -I scripts/17_history_download.py FY civilian (or defense); never publish a year built that way.
name: History backfill

on:
  workflow_dispatch:
    inputs:
      first_fy:
        description: "First fiscal year"
        default: "2008"
        required: true
      last_fy:
        description: "Last fiscal year"
        default: "2026"
        required: true

permissions:
  contents: write            # publish the yearly tables to the history-v1 release

concurrency:
  group: history-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - id: years
        run: python3 -c "import json; print('years=' + json.dumps(list(range(int('${{ inputs.first_fy }}'), int('${{ inputs.last_fy }}') + 1))))" >> "$GITHUB_OUTPUT"

  year:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 3        # be polite to USAspending: at most three years download at once
      matrix:
        fy: ${{ fromJson(needs.plan.outputs.years) }}
    env:
      PIO_CONTACT: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Always both sectors: the yearly tables hold civilian and Defense awards together, and the upload below replaces
      # the year's files, so a one-sector rebuild would drop the other sector from the public tables.
      - name: Download FY${{ matrix.fy }} (civilian agencies and Defense)
        run: python -I scripts/17_history_download.py ${{ matrix.fy }} all

      # Every downloaded file was checked against USAspending's own row count (17_history_download.py). The build carries that
      # check into history_FY<fy>.json and, with --require-verified, fails when the year is not verified, so the publish step
      # below never runs for an incomplete year (see docs/download-integrity.md).
      - name: Build the yearly tables
        run: python -I scripts/18_history_build.py ${{ matrix.fy }} --require-verified

      - name: Publish to the history-v1 release
        run: |
          # second gate: never upload a year whose history_FY<fy>.json does not say verified: true
          python -I -c "import json, sys; d = json.load(open('data/history/processed/history_FY${{ matrix.fy }}.json', encoding='utf-8')); sys.exit(0 if d.get('verified') is True else 'FY${{ matrix.fy }} is not verified: not published')"
          gh release view history-v1 > /dev/null 2>&1 || gh release create history-v1 --title "History tables" \
            --notes "Yearly tables for the long history (FY2008 onward, civilian agencies and the Department of Defense), built by .github/workflows/history.yml. Office names and raw company identifiers are left out only to keep the tables small and focused. vendor_id is a short code derived from the company's public identifier, so the same company can be followed across awards; it is not anonymous. Contract numbers are kept, and every award is public on USAspending.gov. See docs/data-dictionary.md." || true
          gh release upload history-v1 data/history/processed/*FY${{ matrix.fy }}* --clobber
