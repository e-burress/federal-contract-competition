# Offline tests on every change and every week, on Linux and Windows.
# The weekly "reproduce" job downloads the published data snapshot, rebuilds everything and compares it with the published results.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"      # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check Python, packages and folders
        run: python run.py check

      - name: Offline tests
        run: python run.py test

  reproduce:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Rebuild everything from the published data snapshot
        run: python run.py quick

      - name: Compare with the published results
        run: python run.py verify
