# Every morning: save the notices SAM.gov posted the day before (its official API, with the owner's key), forecast each NEW open solicitation's chance of getting only one
# offer and seal the day's forecasts (the forecasts stay private; their fingerprint is published), update the live single-offer
# table for every civilian agency, score the earlier daily forecasts whose awards are now known (totals only), check how the
# sealed threshold forecast (PIO-F2) is tracking, rebuild the pages, and publish.
# After the resolution date (Feb 28, 2027) the same run produces F2's official score once.
# The sealed forecast files are never changed. Run it by hand from the Actions tab ("Run workflow").
# The daily forecasts need the private model file (a draft release named model-v2). Without it, in a fork for example,
# the forecast step says so and stops, and the rest of the run goes on.  See docs/daily-forecasts.md.
name: Daily dashboard refresh

on:
  schedule:
    - cron: "0 12 * * *"     # every day 12:00 UTC (7 AM Eastern in winter, 8 AM in summer); the day before is then over in every US time zone
  workflow_dispatch:

permissions:
  contents: write            # commit the results, and keep the SAM.gov notices and other private files in draft (non-public) releases

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PIO_CONTACT: https://github.com/${{ github.repository }}     # in a fork, the fork's own address
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The data steps keep going if one source is down: the dashboard still updates with what worked,
      # and the run is marked failed so GitHub sends a notification.
      # SAM.gov: only its official API, with the owner's personal key (repository secret SAM_API_KEY, see docs/sam-api-key.md).
      # Only this step gets the key. In this repository a missing key is an error; in a fork without the secret the step is
      # skipped. The notices pulled so far are kept in the draft (non-public) release sam-api-store.
      - name: Save the SAM.gov notices posted since the last run (official API; kept private) and update the daily counts
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        id: sam
        run: python -I scripts/14_sam_daily_snapshot.py --sync --upload ${{ github.repository == 'e-burress/federal-contract-competition' && '--require-key' || '' }}

      - name: Forecast today's new open solicitations and seal them (forecasts private, fingerprint public)
        id: forecast
        if: ${{ !cancelled() && steps.sam.outcome == 'success' }}
        run: python run.py daily-forecast --fetch-model --upload

      - name: Live single-offer table, every civilian agency, this fiscal year so far
        if: ${{ !cancelled() }}
        run: python run.py live

      - name: Score the sealed daily forecasts (totals only; Defense awards are added on Sundays)
        if: ${{ !cancelled() }}
        run: |
          EXTRA=""
          if [ "$(date -u +%u)" = "7" ]; then EXTRA="--defense"; fi
          python run.py score-daily --download --upload $EXTRA

      - name: Check the threshold forecast (and score it after the resolution date)
        if: ${{ !cancelled() }}
        run: python run.py track-f2

      - name: Rebuild the dashboard
        if: ${{ !cancelled() }}
        run: python run.py dashboard

      - name: Rebuild the explorer data
        if: ${{ !cancelled() }}
        run: python run.py explorer

      - name: Rebuild the one-page brief
        if: ${{ !cancelled() }}
        run: python run.py brief

      - name: Check the sealed forecasts are unchanged
        id: seal
        if: ${{ !cancelled() }}
        run: |
          cd forecasts
          grep PIO-F2 SHA256SUMS.txt | awk '{print $1"  "$2}' | sha256sum -c -
          cd ..
          # the daily seal files only ever grow: no earlier line may be changed or removed
          if git diff -U0 HEAD -- forecasts/daily/SHA256SUMS.txt forecasts/daily/ledger.csv forecasts/daily/seen.txt | grep -q '^-[^-]'; then
            echo "an earlier line of the daily seal files was changed or removed: nothing is published"
            exit 1
          fi

      - name: Publish
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs
          # today's seal is published only if the forecast step finished; otherwise its partial files are dropped
          if [ "${{ steps.forecast.outcome }}" = "success" ]; then
            git add forecasts/daily
          else
            git checkout -- forecasts/daily 2> /dev/null || true
            git clean -fdq forecasts/daily
          fi
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
          # main may have moved during the run: put this commit on top of it and push, up to 5 tries
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2> /dev/null || true
            echo "push attempt $attempt failed; trying again shortly"
            sleep $((attempt * 10))
          done
          echo "could not push the daily results after 5 tries"
          exit 1
